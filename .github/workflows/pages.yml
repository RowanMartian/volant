name: Website

on:
  push:
    branches: [main]
    paths: ["docs/**", "site/**", "crates/tools/src/site.rs", ".github/workflows/pages.yml"]
  # If the repository's Pages source is still "Deploy from a branch", GitHub's
  # own build publishes the README over the site on every push. This runs when
  # that build starts, waits for it, and puts the site back.
  page_build:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Let GitHub's branch build finish first, so this deploy lands last
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 72); do
            busy=$(gh run list -R "$GITHUB_REPOSITORY" --limit 20 --json name,status \
              --jq '[.[] | select(.name == "pages build and deployment" and .status != "completed")] | length' || echo 0)
            [ "$busy" = "0" ] && break
            echo "waiting for pages build and deployment ($busy running)"
            sleep 5
          done
      - name: Build the pages from site/
        run: cargo run --quiet --locked -p volant-tools -- site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
