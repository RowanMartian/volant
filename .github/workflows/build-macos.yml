name: Build Mac app

on:
  push:
    branches: [main]
    # The website and README don't change the app.
    paths-ignore: ["docs/**", "site/**", "crates/tools/src/site.rs", "README.md", ".github/workflows/pages.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# A newer push supersedes an older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test the engine pieces
        run: cargo test --locked -p volant-core -p volant-engine -p volant-js -p volant-tools

      - name: Build Volant.app
        env:
          # Lets the app's updater compare itself with this repo's latest release.
          VOLANT_COMMIT: ${{ github.sha }}
          VOLANT_REPO: ${{ github.repository }}
        run: bash scripts/bundle-macos.sh

      - name: Icon as macOS draws it
        run: |
          mkdir -p smoke build
          swiftc -O scripts/bench/appicon.swift -o build/appicon
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$PWD/dist/Volant.app" || true
          build/appicon "$PWD/dist/Volant.app" smoke/appicon.png 1024
          sw_vers; xcodebuild -version | head -1
          xcrun assetutil --info dist/Volant.app/Contents/Resources/Assets.car | grep -E '"(Name|AssetType|RenditionName|Idiom|Appearance)"' | sort | uniq -c | head -30 || true
          echo "Assets.car: $(ls -la dist/Volant.app/Contents/Resources/Assets.car 2>/dev/null || echo missing)"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' dist/Volant.app/Contents/Info.plist || true

      - name: Smoke test (launch, browse, screenshot, quit)
        run: |
          export VOLANT_DATA_DIR="$RUNNER_TEMP/volant-data" VOLANT_SMOKE_DIR="$PWD/smoke"
          mkdir -p "$VOLANT_SMOKE_DIR"
          # A local page for the Canard checks, with a font of the system's as its web font.
          SITE="$RUNNER_TEMP/smoke-site"; mkdir -p "$SITE"; cp scripts/smoke/* "$SITE/"
          cp "$(ls /System/Library/Fonts/Supplemental/*.ttf | head -1)" "$SITE/face.ttf"
          python3 -m http.server 8765 --bind :: --directory "$SITE" > smoke/server-log.txt 2>&1 &
          START=$(date +%s)
          ( dist/Volant.app/Contents/MacOS/Volant --smoke-test > smoke/log.txt 2>&1; echo "exit $?" >> smoke/log.txt ) &
          PID=$!
          for i in $(seq 1 120); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill -0 $PID 2>/dev/null && { echo "still running after 120s" >> smoke/log.txt; pkill -f "Volant --smoke-test" || true; }
          echo "ran for $(( $(date +%s) - START ))s" >> smoke/log.txt
          cat smoke/log.txt smoke/report.txt 2>/dev/null || true
          ls -la smoke
          grep -q "exit 0" smoke/log.txt

      - name: uBlock self-test (default lists, compiled into WebKit, checked on a real page)
        run: |
          export VOLANT_DATA_DIR="$RUNNER_TEMP/ublock-data" VOLANT_SMOKE_DIR="$PWD/smoke"
          ( dist/Volant.app/Contents/MacOS/Volant --ublock-selftest > smoke/ublock-log.txt 2>&1 ) &
          PID=$!
          for i in $(seq 1 660); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          kill -0 $PID 2>/dev/null && { echo "still running after 660s" >> smoke/ublock-log.txt; pkill -f "Volant --ublock-selftest" || true; }
          grep ublock smoke/ublock-log.txt | head -20 || true
          cat smoke/ublock.txt 2>/dev/null || echo "no report"
          { echo '### uBlock self-test'; echo '```'; cat smoke/ublock.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 smoke/ublock.txt | grep -qx PASS

      - name: Updater test (install the current release over a copy of this build)
        env:
          VOLANT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          ZIP_URL="https://github.com/${{ github.repository }}/releases/download/latest/Volant-mac.zip"
          if ! curl -sfL -o "$RUNNER_TEMP/release.zip" "$ZIP_URL"; then echo "No release yet; skipping."; exit 0; fi
          APPS="$RUNNER_TEMP/apps"; rm -rf "$APPS"; mkdir -p "$APPS"
          cp -R dist/Volant.app "$APPS/"
          mkdir -p "$RUNNER_TEMP/release" && ditto -x -k "$RUNNER_TEMP/release.zip" "$RUNNER_TEMP/release"
          want=$(shasum -a 256 "$RUNNER_TEMP/release/Volant.app/Contents/MacOS/Volant" | cut -d' ' -f1)
          before=$(shasum -a 256 "$APPS/Volant.app/Contents/MacOS/Volant" | cut -d' ' -f1)
          # Releases before 2026-11-12 crash on launch if WebKit's rule-list store holds another
          # build's lists (as the steps above leave it); start them with a clean store.
          BID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/Volant.app/Contents/Info.plist)
          find "$HOME/Library" -maxdepth 6 -type d -name ContentRuleLists -path "*$BID*" -print -exec rm -rf {} + 2>/dev/null || true
          VOLANT_DATA_DIR="$RUNNER_TEMP/update-data" "$APPS/Volant.app/Contents/MacOS/Volant" --install-update &
          PID=$!
          for i in $(seq 1 60); do kill -0 $PID 2>/dev/null || break; sleep 1; done
          if kill -0 $PID 2>/dev/null; then echo "Volant didn't quit to update"; exit 1; fi
          relaunched=""
          for i in $(seq 1 30); do relaunched=$(pgrep -f "$APPS/Volant.app/Contents/MacOS/Volant" || true); [ -n "$relaunched" ] && break; sleep 1; done
          after=$(shasum -a 256 "$APPS/Volant.app/Contents/MacOS/Volant" | cut -d' ' -f1)
          echo "before:  $before"; echo "release: $want"; echo "after:   $after"; echo "relaunched pid: ${relaunched:-none}"
          ls -la "$APPS"
          [ -n "$relaunched" ] && kill $relaunched || true
          [ "$after" = "$want" ] || { echo "The app wasn't replaced with the release"; exit 1; }
          [ -n "$relaunched" ] || { echo "The updated app didn't relaunch"; exit 1; }
          [ ! -e "$APPS/Volant.app.previous" ] || { echo "Left the old copy behind"; exit 1; }
          echo "Updated in place and relaunched."

      - name: Benchmark against Safari, Chrome and Firefox
        if: github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 20
        run: |
          bash scripts/bench/run.sh
          cat bench/results.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark
          path: bench/results.md
          if-no-files-found: ignore

      - name: Keep the smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: smoke

      - name: Keep a copy with this run
        uses: actions/upload-artifact@v4
        with:
          name: Volant-mac
          path: dist/Volant.dmg

      - name: Publish to the "Latest build" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never let an older, delayed run replace a newer build.
          git fetch --quiet origin main
          tip=$(git rev-parse origin/main)
          if [ "$tip" != "$GITHUB_SHA" ]; then
            # Later commits that only touch the website or README don't change the app.
            changed=$(git diff --name-only "$GITHUB_SHA" "$tip" | grep -Ev '^(docs/|site/|crates/tools/src/site\.rs$|README\.md$|\.github/workflows/pages\.yml$)' || true)
            if [ -n "$changed" ]; then echo "main has moved on; not publishing"; exit 0; fi
            echo "main has moved on, but only the website changed; publishing"
          fi
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/Volant.dmg dist/Volant-mac.zip \
            --title "Volant — latest build" \
            --target "$GITHUB_SHA" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. Download **Volant.dmg**, open it, and drag Volant into Applications."
