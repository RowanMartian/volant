<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="stylesheet" href="volant://app/style.css">
<style>
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16vh 24px 48px}
.mark{width:64px;height:64px;color:var(--accent);margin-bottom:20px}
.mark svg{width:100%;height:100%;display:block}
.bar{width:min(560px,100%);height:50px;border-radius:14px;background:var(--fill-soft);display:flex;align-items:center;gap:12px;padding:0 18px;color:var(--text3);font-size:15px;text-align:left}
.bar:hover{background:var(--fill)}
.bar svg{width:16px;height:16px;flex:none}
.bar span{flex:1}
.bar kbd{background:var(--bg);color:var(--text2)}
.sites{display:grid;grid-template-columns:repeat(auto-fill,96px);justify-content:center;gap:8px;width:min(640px,100%);margin-top:40px}
.site{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 10px;border-radius:var(--r-md);color:var(--text);text-decoration:none!important;position:relative}
.site:hover{background:var(--fill-soft)}
.site span{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}
.site .x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:6px;display:none;place-items:center;color:var(--text3);font-size:14px;line-height:1}
.site:hover .x{display:grid}
.site .x:hover{background:var(--fill);color:var(--text)}
.empty{margin-top:40px;color:var(--text3);text-align:center;font-size:12.5px;line-height:1.7}
.foot{margin-top:auto;padding-top:40px;display:flex;gap:18px;font-size:12px}
.foot a{color:var(--text3)}
.foot a:hover{color:var(--text2);text-decoration:none}
</style>
</head>
<body>
<script id="volant-data" type="application/json">__VOLANT_DATA__</script>
<script>window.VOLANT_SAMPLE = { top: [['github.com','https://github.com/','GitHub'],['news.ycombinator.com','https://news.ycombinator.com/','Hacker News'],['wikipedia.org','https://en.wikipedia.org/','Wikipedia'],['youtube.com','https://www.youtube.com/','YouTube'],['apple.com','https://www.apple.com/','Apple'],['rust-lang.org','https://www.rust-lang.org/','Rust'],['nytimes.com','https://www.nytimes.com/','NYT'],['figma.com','https://figma.com/','Figma']], engineName: 'DuckDuckGo' };</script>
<script src="volant://app/volant.js"></script>

<div class="mark" id="mark"></div>
<button class="bar" id="bar">
  <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.2 3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  <span id="bar-text">Search or enter an address</span><kbd>⌘ T</kbd>
</button>
<div class="sites" id="sites"></div>
<div class="empty" id="empty" hidden>Sites you visit often will show up here.</div>
<div class="foot">
  <a href="volant://history">History</a>
  <a href="volant://settings">Settings</a>
</div>

<script>
$('#mark').innerHTML = logo();
if (V.engineName) $('#bar-text').textContent = `Search ${V.engineName} or enter an address`;
$('#bar').onclick = () => volant.send('command');
const topSites = V.top || [];
$('#empty').hidden = topSites.length > 0;
$('#sites').innerHTML = topSites.map(([host, url, title]) => `
  <a class="site" href="${esc(url)}" title="${esc(title || host)}">
    ${siteIcon(host, url, 44)}
    <span>${esc(host.replace(/\.(com|org|net|io)$/, ''))}</span>
    <button class="x" data-host="${esc(host)}" title="Remove from this page">×</button>
  </a>`).join('');
$$('.site .x').forEach((b) => b.onclick = (e) => {
  e.preventDefault();
  volant.send('hideSite', b.dataset.host);
  b.closest('.site').remove();
});
</script>
</body>
</html>
