<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New Tab</title>
<link rel="stylesheet" href="volant://app/style.css">
<style>
:root{--pop:#f5f5f7;--wx-cloud:#c7c7cc}
@media (prefers-color-scheme: dark){:root{--pop:#2a2a2c;--wx-cloud:#8e8e93}}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:17vh 24px 96px}
.mark{width:64px;height:64px;color:var(--accent);margin-bottom:22px}
.mark svg{width:100%;height:100%;display:block}
form.search{width:min(560px,100%);height:50px;border-radius:14px;background:var(--fill-soft);display:flex;align-items:center;gap:12px;padding:0 18px;color:var(--text3)}
form.search:focus-within{background:var(--fill)}
form.search svg{width:16px;height:16px;flex:none}
form.search input{flex:1;min-width:0;border:0;background:none;font-size:15px;height:100%;-webkit-user-select:text;user-select:text;color:var(--text)}
form.search input::placeholder{color:var(--text3)}
form.search input:focus,form.search input:focus-visible{outline:none}
.sites{display:grid;grid-template-columns:repeat(auto-fill,96px);justify-content:center;gap:8px;width:min(640px,100%);margin-top:40px}
.site{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 10px;border-radius:var(--r-md);color:var(--text);text-decoration:none!important}
.site:hover{background:var(--fill-soft)}
.site span{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text2)}

/* weather */
.weather{position:fixed;top:20px;right:20px;display:flex;align-items:center;gap:12px;background:var(--fill-soft);border-radius:16px;padding:12px 18px 12px 12px}
.weather .ic{width:40px;height:40px;flex:none}
.weather .ic svg{width:100%;height:100%;display:block}
.weather .t{font-size:26px;font-weight:650;letter-spacing:-.02em;line-height:1}
.weather .d{font-size:12px;color:var(--text2);margin-top:4px;white-space:nowrap}
.weather .p{font-size:11.5px;color:var(--text3);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}

/* the pencil and its panel */
.edit{position:fixed;right:20px;bottom:20px;width:40px;height:40px;border-radius:12px;background:var(--fill-soft);color:var(--text2);display:grid;place-items:center}
.edit:hover,.edit.on{background:var(--fill);color:var(--text)}
.edit svg{width:17px;height:17px}
.pop{position:fixed;right:20px;bottom:70px;width:min(380px,calc(100vw - 40px));max-height:calc(100vh - 100px);overflow:auto;background:var(--pop);border-radius:18px;padding:18px;animation:pop .16s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pop h3{font-size:12px;font-weight:600;color:var(--text3);margin:0 0 8px 2px;letter-spacing:.02em}
.pop section + section{margin-top:22px}
.fav{display:flex;align-items:center;gap:10px;height:42px;padding:0 6px 0 9px;border-radius:10px;background:var(--bg);margin-bottom:4px;cursor:grab}
.fav.dragging{opacity:.4}
.fav .tx{flex:1;min-width:0}
.fav b{display:block;font-size:12.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav small{display:block;font-size:11px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fav .x{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--text3);font-size:16px;flex:none}
.fav .x:hover{background:var(--fill);color:var(--text)}
.empty{font-size:12px;color:var(--text3);margin:0 2px 6px}
.add{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;margin-top:8px}
.add .field,.wx .field{background:var(--bg);height:32px;font-size:12.5px}
.add .field:focus,.wx .field:focus{background:var(--bg)}
.add .btn{height:32px;padding:0 14px}
.err{color:var(--danger);font-size:12px;margin:6px 2px 0}
.err:empty{display:none}
.row{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:12px;padding:10px 12px}
.row .tx{flex:1}
.row b{font-size:13px;font-weight:550}
.wx{margin-top:8px;display:grid;gap:8px}
.wx form{display:flex;gap:6px}
.seg{display:flex;background:var(--bg);border-radius:9px;padding:2px;gap:2px;flex:none}
.seg button{height:28px;padding:0 10px;border-radius:7px;color:var(--text2);font-weight:550;font-size:12px}
.seg button.on{background:var(--fill);color:var(--text)}
.note{font-size:11px;color:var(--text3);margin:0 2px}
</style>
</head>
<body>
<script id="volant-data" type="application/json">__VOLANT_DATA__</script>
<script>window.VOLANT_SAMPLE = { favorites: [['https://github.com/','GitHub'],['https://news.ycombinator.com/','Hacker News'],['https://en.wikipedia.org/','Wikipedia'],['https://www.youtube.com/','YouTube'],['https://www.apple.com/','Apple']], engineName: 'DuckDuckGo',
  weather: { on: true, place: 'Toronto, Ontario', unit: 'c', data: JSON.stringify({ current: { temperature_2m: 7.4, weather_code: 2, is_day: 1 }, daily: { temperature_2m_max: [9.1], temperature_2m_min: [2.3] } }) } };</script>
<script src="volant://app/volant.js"></script>

<div class="weather" id="weather" hidden></div>
<div class="mark" id="mark"></div>
<form class="search" id="search" autocomplete="off">
  <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M11 11l3.2 3.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  <input id="q" type="text" spellcheck="false" autocapitalize="off" autofocus>
</form>
<div class="sites" id="sites"></div>

<button class="edit" id="edit" title="Edit your home page" aria-label="Edit your home page">
  <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M13.6 3.2a2 2 0 0 1 2.8 0l.4.4a2 2 0 0 1 0 2.8L7.5 15.7l-4 1 1-4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 4.8l3.2 3.2" stroke="currentColor" stroke-width="1.7"/></svg>
</button>

<div class="pop" id="pop" hidden>
  <section>
    <h3>FAVOURITES</h3>
    <div id="favs"></div>
    <form class="add" id="add">
      <input class="field" id="add-url" placeholder="Site address" spellcheck="false" autocapitalize="off">
      <input class="field" id="add-name" placeholder="Name (optional)">
      <button class="btn primary">Add</button>
    </form>
    <div class="err" id="add-err"></div>
  </section>
  <section>
    <h3>WIDGETS</h3>
    <div class="row"><div class="tx"><b>Weather</b></div><label class="switch"><input type="checkbox" id="wx-on"><i></i></label></div>
    <div class="wx" id="wx" hidden>
      <form id="wx-form"><input class="field" id="wx-city" placeholder="City, then Return" spellcheck="false"><div class="seg" id="wx-unit"><button type="button" data-v="c">°C</button><button type="button" data-v="f">°F</button></div></form>
      <div class="err" id="wx-err"></div>
      <div class="note">Forecasts from Open-Meteo. Only the city you choose is sent.</div>
    </div>
  </section>
</div>

<script>
$('#mark').innerHTML = logo();
$('#q').placeholder = V.engineName ? `Search ${V.engineName} or enter an address` : 'Search or enter an address';
$('#search').onsubmit = (e) => {
  e.preventDefault();
  const q = $('#q').value.trim();
  if (q) volant.send('go', q);
};
// ⌘T on an existing new tab focuses the field.
window.volantFocus = () => { $('#q').focus(); $('#q').select(); };

/* ---------- favourites ---------- */
let favs = V.favorites || [];
const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };
function renderSites() {
  $('#sites').innerHTML = favs.map(([url, title]) =>
    `<a class="site" href="${esc(url)}" title="${esc(url)}">${siteIcon(hostOf(url), url, 44)}<span>${esc(title || hostOf(url))}</span></a>`).join('');
  $('#favs').innerHTML = favs.map(([url, title], i) =>
    `<div class="fav" draggable="true" data-i="${i}">${siteIcon(hostOf(url), url, 22)}<span class="tx"><b>${esc(title || hostOf(url))}</b><small>${esc(hostOf(url))}</small></span>
      <button class="x" data-url="${esc(url)}" title="Remove">×</button></div>`).join('')
    || '<div class="empty">Add the sites you want one click away.</div>';
}
window.volantFavorites = (list, err) => {
  if (list) favs = list;
  renderSites();
  $('#add-err').textContent = err || '';
  if (!err) { $('#add-url').value = ''; $('#add-name').value = ''; }
};
$('#add').onsubmit = (e) => {
  e.preventDefault();
  const url = $('#add-url').value.trim();
  if (!url) return;
  volant.send('favAdd', url + '\t' + $('#add-name').value.trim());
  if (!volant.live) window.volantFavorites([...favs, ['https://' + url.replace(/^https?:\/\//, ''), $('#add-name').value.trim()]]);
};
$('#favs').addEventListener('click', (e) => {
  const x = e.target.closest('.x');
  if (!x) return;
  volant.send('favRemove', x.dataset.url);
  window.volantFavorites(favs.filter(([u]) => u !== x.dataset.url));
});
// Drag to reorder.
let dragFrom = -1;
$('#favs').addEventListener('dragstart', (e) => {
  const f = e.target.closest('.fav'); if (!f) return;
  dragFrom = +f.dataset.i; f.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', String(dragFrom));
});
$('#favs').addEventListener('dragover', (e) => { if (dragFrom >= 0) e.preventDefault(); });
$('#favs').addEventListener('drop', (e) => {
  e.preventDefault();
  const f = e.target.closest('.fav');
  const to = f ? +f.dataset.i : favs.length - 1;
  if (dragFrom >= 0 && to !== dragFrom) {
    volant.send('favMove', dragFrom + '\t' + to);
    const next = favs.slice(); const [m] = next.splice(dragFrom, 1); next.splice(to, 0, m);
    window.volantFavorites(next);
  }
  dragFrom = -1;
});
$('#favs').addEventListener('dragend', () => { dragFrom = -1; $$('.fav').forEach((f) => f.classList.remove('dragging')); });

/* ---------- the pencil ---------- */
function openPop(on) {
  $('#pop').hidden = !on;
  $('#edit').classList.toggle('on', on);
  if (on) $('#add-url').focus(); else $('#q').focus();
}
$('#edit').onclick = (e) => { e.stopPropagation(); openPop($('#pop').hidden); };
document.addEventListener('mousedown', (e) => { if (!$('#pop').hidden && !e.target.closest('#pop, #edit')) openPop(false); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#pop').hidden) openPop(false); });

/* ---------- weather ---------- */
const W = V.weather || {};
const WX = {
  sun: '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="8" fill="#ffb800"/><g stroke="#ffb800" stroke-width="2.6" stroke-linecap="round"><path d="M20 4v4M20 32v4M4 20h4M32 20h4M8.7 8.7l2.8 2.8M28.5 28.5l2.8 2.8M8.7 31.3l2.8-2.8M28.5 11.5l2.8-2.8"/></g></svg>',
  moon: '<svg viewBox="0 0 40 40"><path d="M25 7a13 13 0 1 0 8 21A11 11 0 0 1 25 7z" fill="#a1a1c6"/></svg>',
  part: '<svg viewBox="0 0 40 40"><circle cx="15" cy="15" r="7" fill="#ffb800"/><path d="M14 33h16a6 6 0 0 0 0-12 8 8 0 0 0-15 2 5 5 0 0 0-1 10z" fill="var(--wx-cloud)"/></svg>',
  cloud: '<svg viewBox="0 0 40 40"><path d="M11 30h19a7 7 0 0 0 0-14 9 9 0 0 0-17 2 6 6 0 0 0-2 12z" fill="var(--wx-cloud)"/></svg>',
  rain: '<svg viewBox="0 0 40 40"><path d="M11 24h19a7 7 0 0 0 0-14 9 9 0 0 0-17 2 6 6 0 0 0-2 12z" fill="var(--wx-cloud)"/><g stroke="var(--accent)" stroke-width="2.4" stroke-linecap="round"><path d="M14 28l-2 5M21 28l-2 5M28 28l-2 5"/></g></svg>',
  snow: '<svg viewBox="0 0 40 40"><path d="M11 24h19a7 7 0 0 0 0-14 9 9 0 0 0-17 2 6 6 0 0 0-2 12z" fill="var(--wx-cloud)"/><g fill="var(--accent)"><circle cx="14" cy="30" r="1.8"/><circle cx="21" cy="33" r="1.8"/><circle cx="28" cy="30" r="1.8"/></g></svg>',
  storm: '<svg viewBox="0 0 40 40"><path d="M11 24h19a7 7 0 0 0 0-14 9 9 0 0 0-17 2 6 6 0 0 0-2 12z" fill="var(--wx-cloud)"/><path d="M21 25l-4 7h4l-2 6 7-9h-4l2-4z" fill="#ffb800"/></svg>',
  fog: '<svg viewBox="0 0 40 40"><g stroke="var(--wx-cloud)" stroke-width="3" stroke-linecap="round"><path d="M8 15h24M11 21h20M8 27h22"/></g></svg>',
};
// WMO weather codes, as Open-Meteo reports them.
function describe(code, day) {
  if (code === 0) return ['Clear', day ? 'sun' : 'moon'];
  if (code <= 2) return [code === 1 ? 'Mostly clear' : 'Partly cloudy', day ? 'part' : 'cloud'];
  if (code === 3) return ['Cloudy', 'cloud'];
  if (code === 45 || code === 48) return ['Fog', 'fog'];
  if (code >= 51 && code <= 57) return ['Drizzle', 'rain'];
  if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return ['Rain', 'rain'];
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return ['Snow', 'snow'];
  if (code >= 95) return ['Thunderstorms', 'storm'];
  return ['', 'cloud'];
}
function renderWeather(raw) {
  const el = $('#weather');
  let d = null;
  try { d = JSON.parse(raw); } catch {}
  if (!W.on || !W.place || !d || !d.current) { el.hidden = true; return; }
  const [label, icon] = describe(d.current.weather_code, d.current.is_day);
  const r = Math.round;
  const daily = d.daily || {};
  const hi = daily.temperature_2m_max ? r(daily.temperature_2m_max[0]) : null;
  const lo = daily.temperature_2m_min ? r(daily.temperature_2m_min[0]) : null;
  el.innerHTML = `<div class="ic">${WX[icon]}</div><div><div class="t">${r(d.current.temperature_2m)}°</div>
    <div class="d">${esc(label)}${hi !== null ? ` · H ${hi}° L ${lo}°` : ''}</div><div class="p">${esc(W.place)}</div></div>`;
  el.hidden = false;
}
window.volantWeather = (raw, err) => {
  if (err) $('#wx-err').textContent = err;
  else renderWeather(raw);
};
window.volantGeo = (raw) => {
  let d = null;
  try { d = JSON.parse(raw); } catch {}
  const g = d && d.results && d.results[0];
  if (!g) { $('#wx-err').textContent = 'Couldn’t find that city.'; return; }
  const place = [g.name, g.admin1 && g.admin1 !== g.name ? g.admin1 : g.country].filter(Boolean).join(', ');
  W.place = place;
  $('#wx-city').value = place;
  $('#wx-err').textContent = '';
  volant.send('set', 'weather_place=' + place);
  volant.send('set', `weather_at=${g.latitude},${g.longitude}`);
  volant.send('weatherFetch');
};
function syncWeatherControls() {
  $('#wx-on').checked = !!W.on;
  $('#wx').hidden = !W.on;
  $('#wx-city').value = W.place || '';
  $$('#wx-unit button').forEach((b) => b.classList.toggle('on', b.dataset.v === (W.unit || 'c')));
}
$('#wx-on').onchange = (e) => {
  W.on = e.target.checked;
  volant.send('set', 'weather=' + (W.on ? 1 : 0));
  syncWeatherControls();
  if (W.on && W.place) volant.send('weatherFetch'); else renderWeather('');
  if (W.on && !W.place) $('#wx-city').focus();
};
$('#wx-form').onsubmit = (e) => {
  e.preventDefault();
  const city = $('#wx-city').value.trim();
  if (city) { $('#wx-err').textContent = ''; volant.send('weatherPlace', city); }
};
$$('#wx-unit button').forEach((b) => b.onclick = () => {
  W.unit = b.dataset.v;
  syncWeatherControls();
  volant.send('set', 'weather_unit=' + W.unit);
  if (W.place) volant.send('weatherFetch');
});

renderSites();
syncWeatherControls();
if (W.on && W.place) { if (W.data) renderWeather(W.data); else volant.send('weatherFetch'); }
$('#q').focus();
</script>
</body>
</html>
