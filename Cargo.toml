[workspace]
resolver = "2"
members = ["crates/core", "crates/engine", "crates/js", "crates/app", "crates/tools"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/RowanMartian/volant"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwind, so a bug in the page engine ends that page's session instead of the browser.
panic = "unwind"
strip = true
